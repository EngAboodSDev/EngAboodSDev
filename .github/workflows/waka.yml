name: Work Stats Readme

on:
  # يتيح لك تشغيل التحديث يدوياً في أي وقت
  workflow_dispatch:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"

jobs:
  update-readme:
    name: Update this Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master 
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # خيارات إضافية لتخصيص العرض
          SHOW_LOC_CHART: "true" # عرض رسم بياني لأسطر الأكواد
          SHOW_PROJECTS: "false" # إخفاء أسماء المشاريع الخاصة إن أردت
          SHOW_DAYS_OF_WEEK: "true" # عرض الأيام الأكثر إنتاجية
