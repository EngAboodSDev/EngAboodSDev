<svg xmlns="http://w3.org" viewBox="0 0 800 20" width="100%" height="20">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- ألوان نيون متدرجة (بنفسجي إلى أزرق مضيء) -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a100ff" />   <!-- بنفسجي نيون -->
      <stop offset="50%" stop-color="#00f2fe" />  <!-- أزرق سيان مضيء -->
      <stop offset="100%" stop-color="#a100ff" /> <!-- بنفسجي نيون لضمان سلاسة الحركة -->
    </linearGradient>
  </defs>

  <style>
    .track {
      fill: none;
      stroke: url(#neonGradient);
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: url(#glow);
    }
    .t1 {
      stroke-dasharray: 40 20;
      animation: moveForward 3s linear infinite;
    }
    .t2 {
      stroke-dasharray: 40 20;
      animation: moveBackward 3s linear infinite;
    }
    @keyframes moveForward {
      from { stroke-dashoffset: 120; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes moveBackward {
      from { stroke-dashoffset: -120; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <path class="track t1" d="M 0 10 Q 100 0, 200 10 T 400 10 T 600 10 T 800 10" />
  <path class="track t2" d="M 0 10 Q 100 20, 200 10 T 400 10 T 600 10 T 800 10" />
</svg>
